name: Generate terminal profile
on:
  push:
    branches: [main]
    paths:
      - 'data/profile.json'
      - 'data/robot.txt'
      - 'scripts/render_profile.py'
      - '.github/workflows/profile-art.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate animated SVG
        run: python scripts/render_profile.py
      - name: Commit updated artwork
        run: |
          if git diff --quiet -- assets/terminal-profile.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/terminal-profile.svg
          git commit -m 'chore: regenerate terminal profile'
          git push
