  <desc>herrera@github:~$ cat about.md
Systems Engineer from Universidad del Valle (Cali, Colombia), with professional experience
since 2023 across frontend, backend, and applied NLP. All degree requirements completed;
degree conferral expected in December 2026.

My undergraduate thesis builds a named entity recognition system for Spanish clinical text,
comparing CRF, BiLSTM, RoBERTa and LLM approaches. In 2026 I completed a research internship
at the PReCISE group, Université de Namur (Belgium) — where, fittingly for the theme of this
page, I modeled the variability of the FIA Formula 1 2026 Technical Regulations using formal
methods and SMT solvers.

