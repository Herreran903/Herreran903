# Right half of the top console: typed once next to the looping robot.
# Generated without window chrome; scripts/build_top_svg.py adds the title bar
# and the robot frames, producing assets/terminal-top.svg.
theme:
  name: robot
  colors:
    text: "#b9c9ce"
    comment: "#9eb3b6"
    background: "#101e25"
    titleBarBackground: "#101e25"
    titleBarText: "#9eb3b6"
    prompt: "#87c6c3"
    cursor: "#f1dfb7"
    red: "#cf8067"
    green: "#66c99a"
    yellow: "#d9b778"
    blue: "#87c6c3"
    magenta: "#cf8067"
    cyan: "#87c6c3"
    white: "#f1dfb7"
    orange: "#d9b778"
    purple: "#b9c9ce"
    pink: "#cf8067"
    brightRed: "#cf8067"
    brightGreen: "#66c99a"
    brightYellow: "#d9b778"
    brightBlue: "#87c6c3"
    brightMagenta: "#cf8067"
    brightCyan: "#87c6c3"
    brightWhite: "#f1dfb7"
    brightBlack: "#36535b"
  buttons:
    close: "#cf8067"
    minimize: "#d9b778"
    maximize: "#7fa89a"

window:
  width: 800
  height: 320
  style: none
  borderRadius: 0

terminal:
  fontFamily: "Menlo, Consolas, DejaVu Sans Mono, monospace"
  fontSize: 20
  lineHeight: 1.5
  padding: 8
  paddingTop: 34
  prompt: "$ "

effects:
  textGlow: false
  scanlines: false
  vignette: false
  shadow: false

animation:
  loop: false
  defaultTypingDuration: 600
  outputLineStagger: 40
  commandOutputPause: 150
  defaultSequencePause: 250

blocks:
  - block: custom
    config:
      command: whoami
      lines:
        - "[[fg:white]]Nicolás Herrera[[/fg]]"
        - "Systems Engineer · Universidad del Valle"
        - "backend · applied NLP · learning RAG & robotics"
        - ""

  - block: custom
    config:
      command: cat stack.txt
      lines:
        - "Python · FastAPI · Java · Spring Boot · TypeScript · Docker"
        - ""
        - "[[fg:green]]●[[/fg]] Open to remote opportunities"
