<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Nicolas Herrera Marulanda - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="55%" stop-color="#131A26"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0"/>
      <stop offset="18%" stop-color="#E10600"/>
      <stop offset="82%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
    </linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#0B0E14"/>
      <rect width="12" height="12" fill="#E6E8EB"/>
      <rect x="12" y="12" width="12" height="12" fill="#E6E8EB"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="maskR"><rect x="1020" y="0" width="180" height="280" fill="url(#fadeR)"/></mask>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <g opacity="0.10" stroke="#8A94A6" stroke-width="1" fill="none">
    <path d="M60 232 C 180 232, 210 150, 320 150 S 470 92, 560 92 S 720 168, 830 168 S 1010 108, 1140 108"/>
    <path d="M60 246 C 180 246, 210 164, 320 164 S 470 106, 560 106 S 720 182, 830 182 S 1010 122, 1140 122"/>
  </g>

  <rect x="1020" y="0" width="180" height="280" fill="url(#checker)" opacity="0.16" mask="url(#maskR)"/>

  <rect x="60" y="88" width="5" height="104" rx="2.5" fill="#E10600"/>

  <text x="88" y="126" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#F2F4F7" letter-spacing="0.5">Nicolás Herrera Marulanda</text>
  <text x="90" y="160" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#E10600" letter-spacing="2.2">FULL STACK DEVELOPER</text>
  <text x="90" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#9AA4B2">Applied NLP &amp; Machine Learning · Systems Engineering, Universidad del Valle</text>

  <rect x="0" y="272" width="1200" height="3" fill="url(#redline)"/>
</svg>
